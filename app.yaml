command:
  - "python"
  - "app.py"

env:
  # --- Lakebase secret (base64 Postgres URL; decoded in lakebase.py) --------
  - name: LAKEBASE_SECRET_SCOPE
    value: "database-day1"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"

  # --- NWS weather API -----------------------------------------------------
  # NWS requires a descriptive User-Agent with a contact, or it returns 403.
  # Replace the contact below with a real email/URL before deploying.
  - name: WEATHER_API_BASE_URL
    value: "https://api.weather.gov"
  - name: WEATHER_USER_AGENT
    value: "(weather-lakebase-homework, your-email@example.com)"
  - name: WEATHER_LOCATIONS
    value: "Chicago, IL;Austin, TX;Miami, FL;Oklahoma City, OK"

  # --- Embeddings (must match the ingest notebook's model) -----------------
  - name: EMBEDDING_MODEL
    value: "sentence-transformers/all-MiniLM-L6-v2"
