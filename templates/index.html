<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weather Intelligence — Semantic Search</title>
  <style>
    /* Minimal, dependency-free styling. Single-file so it deploys with the
       Databricks App without a bundler or CDN. */
    :root {
      --bg: #0f172a; --panel: #1e293b; --line: #334155;
      --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8; --accent-ink: #0f172a;
      --good: #34d399;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font: 15px/1.55 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg); color: var(--text);
    }
    header { padding: 28px 20px 10px; max-width: 860px; margin: 0 auto; }
    h1 { margin: 0 0 4px; font-size: 22px; }
    .sub { color: var(--muted); margin: 0; }
    main { max-width: 860px; margin: 0 auto; padding: 12px 20px 60px; }
    section {
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
      padding: 18px; margin-top: 18px;
    }
    h2 { margin: 0 0 12px; font-size: 15px; text-transform: uppercase;
         letter-spacing: .04em; color: var(--muted); }
    label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
    input, select, textarea {
      width: 100%; padding: 9px 11px; background: #0b1220; color: var(--text);
      border: 1px solid var(--line); border-radius: 8px; font: inherit;
    }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .row > div { flex: 1; min-width: 160px; }
    button {
      margin-top: 14px; padding: 9px 16px; border: 0; border-radius: 8px;
      background: var(--accent); color: var(--accent-ink); font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: default; }
    .status { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 18px; }
    .card {
      border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
      margin-top: 10px; background: #0b1220;
    }
    .card .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
    .loc { font-weight: 600; }
    .sim { color: var(--good); font-variant-numeric: tabular-nums; font-size: 13px; }
    .tag {
      display: inline-block; font-size: 11px; text-transform: uppercase;
      letter-spacing: .05em; padding: 1px 7px; border-radius: 999px;
      border: 1px solid var(--line); color: var(--muted); margin-left: 8px;
    }
    .snippet { color: var(--text); margin-top: 6px; font-size: 14px; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }

    /* --- Location autocomplete + chips --- */
    .combo { position: relative; }
    .suggest {
      position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 4px);
      background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
      overflow: hidden; box-shadow: 0 10px 28px rgba(0,0,0,.45);
    }
    .suggest .opt { padding: 9px 11px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
    .suggest .opt:hover, .suggest .opt.active { background: #0b1220; }
    .suggest .opt .st { color: var(--muted); font-size: 12px; }
    .suggest .empty { padding: 9px 11px; color: var(--muted); font-size: 13px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip {
      display: inline-flex; align-items: center; gap: 7px; background: #0b1220;
      border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 11px;
      font-size: 13px;
    }
    .chip button {
      all: unset; cursor: pointer; color: var(--muted); font-size: 15px;
      line-height: 1; padding: 0 3px; margin: 0;
    }
    .chip button:hover { color: var(--text); }
  </style>
</head>
<body>
  <header>
    <h1>🌦️ Weather Intelligence</h1>
    <p class="sub">Semantic search over NWS alerts &amp; forecasts, powered by Lakebase + pgvector.</p>
  </header>

  <main>
    <!-- ── Harvest ─────────────────────────────────────────────────────── -->
    <section>
      <h2>1 · Harvest</h2>
      <label for="locInput">Locations — search any US city</label>
      <div class="combo">
        <input id="locInput" autocomplete="off"
               placeholder="Start typing… e.g. Milwaukee, New York, Denver" />
        <div id="locSuggest" class="suggest" hidden></div>
      </div>
      <div id="locChips" class="chips"></div>
      <p class="hint">Type a city and pick a match (↑/↓ + Enter works too), or paste a "lat,lon" pair. Add as many as you like.</p>
      <div class="row">
        <div>
          <label for="limit">Max docs per location</label>
          <input id="limit" type="number" value="50" min="1" max="500" />
        </div>
      </div>
      <button id="syncBtn">Sync from NWS</button>
      <div id="syncStatus" class="status"></div>
    </section>

    <!-- ── Retrieve ────────────────────────────────────────────────────── -->
    <section>
      <h2>2 · Search</h2>
      <label for="query">Natural-language query</label>
      <input id="query" value="flash flood risk this weekend"
             placeholder="e.g. excessive heat warning" />
      <div class="row">
        <div>
          <label for="mode">Search mode</label>
          <select id="mode">
            <option value="chunk">chunk (passage-level)</option>
            <option value="document">document (whole-doc)</option>
          </select>
        </div>
        <div>
          <label for="source">Source filter</label>
          <select id="source">
            <option value="">any</option>
            <option value="alert">alert</option>
            <option value="forecast">forecast</option>
          </select>
        </div>
        <div>
          <label for="topk">Top K (1–20)</label>
          <input id="topk" type="number" value="5" min="1" max="20" />
        </div>
      </div>
      <button id="searchBtn">Search</button>
      <div id="searchStatus" class="status"></div>
      <div id="results"></div>
    </section>
  </main>

  <script>
    const $ = id => document.getElementById(id);

    // Tiny helper: POST JSON and parse JSON, surfacing API errors uniformly.
    async function postJSON(path, body) {
      const resp = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);
      return data;
    }

    const debounce = (fn, ms) => {
      let t;
      return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
    };

    // ── Location autocomplete + chips ────────────────────────────────────
    // selected: the chosen locations, each {label, lat, lon}. We send their
    // coordinates to /weather/sync, so the backend never has to re-geocode.
    const selected = [];
    let suggestions = [];   // current dropdown candidates
    let activeIdx = -1;     // keyboard-highlighted candidate

    function renderChips() {
      const box = $("locChips");
      box.innerHTML = "";
      selected.forEach((loc, i) => {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.append(loc.label);                    // textContent — safe from injection
        const x = document.createElement("button");
        x.type = "button"; x.textContent = "✕"; x.title = "Remove";
        x.addEventListener("click", () => { selected.splice(i, 1); renderChips(); });
        chip.append(x);
        box.append(chip);
      });
    }

    function addLocation(loc) {
      // De-dupe on coordinates so the same place can't be added twice.
      if (!selected.some(s => s.lat === loc.lat && s.lon === loc.lon)) {
        selected.push(loc);
        renderChips();
      }
      $("locInput").value = "";
      hideSuggest();
    }

    function hideSuggest() {
      suggestions = []; activeIdx = -1;
      const el = $("locSuggest"); el.hidden = true; el.innerHTML = "";
    }

    function paintActive() {
      $("locSuggest").querySelectorAll(".opt")
        .forEach((o, i) => o.classList.toggle("active", i === activeIdx));
    }

    function renderSuggest(list) {
      suggestions = list; activeIdx = -1;
      const el = $("locSuggest");
      el.innerHTML = "";
      if (!list.length) {
        const empty = document.createElement("div");
        empty.className = "empty"; empty.textContent = "No US matches";
        el.append(empty); el.hidden = false; return;
      }
      list.forEach((r, i) => {
        const opt = document.createElement("div");
        opt.className = "opt"; opt.dataset.i = i;
        const city = document.createElement("span");
        city.textContent = (r.label || "").split(",")[0];   // textContent — no HTML injection
        const st = document.createElement("span");
        st.className = "st"; st.textContent = r.state || "";
        opt.append(city, st);
        // mousedown (not click) fires before the input's blur, so the pick lands.
        opt.addEventListener("mousedown", (e) => {
          e.preventDefault();
          addLocation({ label: r.label, lat: r.lat, lon: r.lon });
        });
        el.append(opt);
      });
      el.hidden = false;
    }

    const doGeocode = debounce(async (q) => {
      try {
        const resp = await fetch(`/weather/geocode?q=${encodeURIComponent(q)}&limit=6`);
        const data = await resp.json();
        renderSuggest(data.results || []);
      } catch { hideSuggest(); }
    }, 250);

    $("locInput").addEventListener("input", (e) => {
      const q = e.target.value.trim();
      if (q.length < 2) { hideSuggest(); return; }
      doGeocode(q);
    });

    $("locInput").addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown" && suggestions.length) {
        e.preventDefault(); activeIdx = Math.min(activeIdx + 1, suggestions.length - 1); paintActive();
      } else if (e.key === "ArrowUp" && suggestions.length) {
        e.preventDefault(); activeIdx = Math.max(activeIdx - 1, 0); paintActive();
      } else if (e.key === "Enter") {
        e.preventDefault();
        const raw = e.target.value.trim();
        const m = raw.match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);
        if (activeIdx >= 0 && suggestions[activeIdx]) {
          addLocation(suggestions[activeIdx]);          // highlighted pick
        } else if (suggestions.length) {
          addLocation(suggestions[0]);                  // top match
        } else if (m) {
          addLocation({ label: raw, lat: parseFloat(m[1]), lon: parseFloat(m[2]) });  // raw lat,lon
        }
      } else if (e.key === "Escape") {
        hideSuggest();
      }
    });

    // Close the dropdown on blur, but after any pending mousedown pick.
    $("locInput").addEventListener("blur", () => setTimeout(hideSuggest, 150));

    // ── Sync ─────────────────────────────────────────────────────────────
    $("syncBtn").addEventListener("click", async () => {
      const btn = $("syncBtn"), status = $("syncStatus");
      if (!selected.length) { status.textContent = "Add at least one location first."; return; }
      btn.disabled = true; status.textContent = "Harvesting from api.weather.gov…";
      try {
        const data = await postJSON("/weather/sync", {
          locations: selected.map(l => `${l.lat},${l.lon}`),
          limit: Number($("limit").value),
        });
        let msg = `✅ Synced ${data.synced} documents for ${data.locations.join(", ")}.`;
        if (data.skipped?.length) msg += ` Skipped: ${data.skipped.map(s => s.location).join(", ")}.`;
        status.textContent = msg;
      } catch (e) {
        status.textContent = "⚠️ " + e.message;
      } finally { btn.disabled = false; }
    });

    // ── Search ───────────────────────────────────────────────────────────
    $("searchBtn").addEventListener("click", async () => {
      const btn = $("searchBtn"), status = $("searchStatus"), results = $("results");
      btn.disabled = true; status.textContent = "Embedding query & searching…"; results.innerHTML = "";
      try {
        const data = await postJSON("/weather/search", {
          query: $("query").value,
          top_k: Number($("topk").value),
          search_mode: $("mode").value,
          source_type: $("source").value || null,
        });
        status.textContent = `${data.count} result(s) for "${data.query}".`;
        for (const r of data.results) {
          const card = document.createElement("div");
          card.className = "card";
          const snippet = r.chunk_text || r.narrative_text || "";
          card.innerHTML = `
            <div class="top">
              <span class="loc"></span>
              <span class="sim">${(r.similarity ?? 0).toFixed(3)}</span>
            </div>
            <div class="snippet"></div>`;
          // Fill text via textContent to avoid injecting raw API text as HTML.
          card.querySelector(".loc").textContent =
            `${r.location ?? "—"} · ${r.headline ?? ""} ${r.source_type ? "(" + r.source_type + ")" : ""}`;
          card.querySelector(".snippet").textContent = snippet.slice(0, 400);
          results.appendChild(card);
        }
        if (!data.results.length) results.innerHTML = '<p class="hint">No matches — has the embed step run?</p>';
      } catch (e) {
        status.textContent = "⚠️ " + e.message;
      } finally { btn.disabled = false; }
    });
  </script>
</body>
</html>
